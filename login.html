<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Game Dev Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1593305841991-05c297ba4575?q=80&w=2574&auto=format&fit=crop') center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(0, 0, 0, 0.8);
            padding: 50px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
        }

        .auth-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 30px;
            display: block;
            text-decoration: none;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        .btn-block {
            width: 100%;
            display: block;
            text-align: center;
        }

        .auth-link {
            color: #ccc;
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
        }

        .auth-link a {
            color: var(--primary-orange);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            background-color: #222;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: 0.3s;
        }

        .social-links a:hover {
            background-color: var(--primary-orange);
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <a href="index.html" class="auth-logo">GAME DEV STUDIO</a>
        <form action="dashboard.html">
            <div class="form-group"><input type="email" class="form-control" placeholder="Email Address" required></div>
            <div class="form-group"><input type="password" class="form-control" placeholder="Password" required></div>
            <button type="submit" class="btn btn-primary btn-block">LOGIN</button>
        </form>
        <span class="auth-link">Don't have an account? <a href="register.html">Sign Up</a></span>

        <div class="social-links">
            <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
    </div>
</body>

</html>
