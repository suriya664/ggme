<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Game Dev Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">

</head>

<body class="auth-body"
    style="background-image: url('https://images.unsplash.com/photo-1587202372634-32705e3bf49c?q=80&w=2574&auto=format&fit=crop');">
    <div class="auth-card-glass">
        <div class="auth-header">
            <a href="index.html" class="brand-logo">GAME DEV STUDIO</a>
            <p class="auth-subtitle">Join the Revolution.</p>
        </div>

        <form action="dashboard.html">
            <div class="form-floating">
                <input type="text" class="form-control" id="fullname" placeholder="Full Name" required>

            </div>

            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>

            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" required>

            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="confirm-password" placeholder="Confirm Password"
                    required>

            </div>

            <button type="submit" class="btn-premium">REGISTER</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>

        <div class="social-login">
            <p class="auth-subtitle" style="font-size: 0.8rem;">OR REGISTER WITH</p>
            <div class="social-icons-glass">
                <a href="#" class="social-icon-btn" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon-btn" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon-btn" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" class="social-icon-btn" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>



    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init();</script>
    <button class="theme-switcher auth-theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>
    <script src="js/main.js"></script>
</body>

</html>
